appId: br.fpsboost.app
productName: FpsBoost
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - build/icon.png
extraResources:
  - from: resources/tweaks
    to: tweaks
  - from: resources/appx-catalog.json
    to: appx-catalog.json
  - from: resources/winget-catalog.json
    to: winget-catalog.json
win:
  icon: build/icon.ico
  target: nsis
  requestedExecutionLevel: requireAdministrator
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: FpsBoost
publish:
  provider: github
  owner: vinincarvalhos
  repo: fps-boost
